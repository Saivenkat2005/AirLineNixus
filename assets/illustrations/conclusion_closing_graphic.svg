<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="closeSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040714"/>
      <stop offset="50%" stop-color="#08102A"/>
      <stop offset="100%" stop-color="#0A1635"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#closeSky)"/>

  <!-- Glowing Mesh Waves in Background -->
  <g stroke="#00F0FF" stroke-width="1.2" opacity="0.25" stroke-dasharray="3,6">
    <path d="M 0 420 C 300 350, 600 480, 900 390 L 1200 350" fill="none"/>
    <path d="M 0 480 C 350 420, 700 540, 1050 460 L 1200 420" fill="none"/>
    <path d="M 0 550 C 400 490, 800 600, 1200 520" fill="none"/>
  </g>

  <!-- Constellation Nodes -->
  <g fill="#00F0FF" opacity="0.5">
    <circle cx="150" cy="380" r="4"/>
    <circle cx="350" cy="340" r="5"/>
    <circle cx="600" cy="450" r="5"/>
    <circle cx="850" cy="390" r="6"/>
    <circle cx="1080" cy="340" r="5"/>
  </g>

  <!-- Commercial Airliner Positioned in Upper-Right Sky Angle (Clean Separation) -->
  <g transform="translate(860, 160) rotate(-12) scale(0.7)">
    <path d="M -180,30 C -120,10, 50,8, 160,25 C 210,32, 235,40, 245,46 C 235,52, 190,58, 120,60 C 20,64, -130,58, -180,45 Z" fill="#E2E8F0" opacity="0.9"/>
    <polygon points="-170,30 -200,-50 -170,-50 -130,24" fill="#0070F3"/>
    <polygon points="-40,46 40,48 110,120 60,124 -10,60" fill="#94A3B8" opacity="0.85"/>
    <rect x="15" y="65" width="45" height="18" rx="8" fill="#1E293B"/>
    <path d="M -140 45 L -350 55 L -350 50 Z" fill="#00F0FF" opacity="0.5"/>
  </g>

  <!-- Central Typography & Closing Badge -->
  <g text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif">
    <!-- Category Pill -->
    <rect x="420" y="65" width="360" height="32" rx="16" fill="#00F0FF" fill-opacity="0.12" stroke="#00F0FF" stroke-width="1.5"/>
    <text x="600" y="86" font-size="12" font-weight="bold" fill="#00F0FF" letter-spacing="2">KLEF CAPSTONE DEFENCE • CSE CLUSTER A</text>

    <!-- Main Title -->
    <text x="600" y="175" font-size="48" font-weight="900" fill="#FFFFFF" letter-spacing="1">Thank You</text>
    <text x="600" y="225" font-size="20" font-weight="700" fill="#38BDF8">Cloud-Native API Gateway &amp; Service Mesh Architecture</text>
    <text x="600" y="255" font-size="14" fill="#94A3B8">Decoupled Zero-Trust Security, Dynamic Routing &amp; Distributed Resilience</text>

    <!-- Q&A Hero Button -->
    <g transform="translate(435, 305)">
      <rect width="330" height="65" rx="32.5" fill="#172554" stroke="#3B82F6" stroke-width="2"/>
      <text x="165" y="41" font-size="22" font-weight="bold" fill="#FFFFFF">Questions &amp; Answers</text>
    </g>

    <!-- 4 Key Highlight Indicators -->
    <g transform="translate(250, 410)" font-size="12" fill="#34D399" font-weight="600">
      <text x="0" y="0">✔ 1,840 Sustained RPS</text>
      <text x="190" y="0">✔ 3.82ms p99 Overhead</text>
      <text x="390" y="0">✔ 100% Strict mTLS</text>
      <text x="560" y="0">✔ 94.6% CapEx Savings</text>
    </g>

    <!-- Supervision & Academic Details -->
    <text x="600" y="475" font-size="13.5" fill="#E2E8F0">Guided by: <tspan font-weight="bold" fill="#38BDF8">Mr. BVN Prasad Paruchuri</tspan> (Assistant Professor, Dept. of CSE)</text>
    <text x="600" y="500" font-size="13" fill="#CBD5E1">Coordinated by: <tspan font-weight="bold">Mrs. P. Anusha</tspan> | Headed by: <tspan font-weight="bold">Dr. A. Senthil</tspan> (Professor &amp; HOD)</text>
    <text x="600" y="530" font-size="12" fill="#64748B">Team 139 (Batch CSE-3) • Academic Year 2026–2027 • KLEF Deemed to be University</text>
  </g>
</svg>