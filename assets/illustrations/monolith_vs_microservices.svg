<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480">
  <defs>
    <linearGradient id="badCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0D15"/>
      <stop offset="100%" stop-color="#2D1119"/>
    </linearGradient>
    <linearGradient id="goodCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081A2F"/>
      <stop offset="100%" stop-color="#0A2A3D"/>
    </linearGradient>
  </defs>

  <rect width="960" height="480" fill="#080D1E" rx="16"/>

  <!-- Left: Monolithic Anti-Pattern -->
  <g transform="translate(30, 25)">
    <rect width="430" height="430" rx="14" fill="url(#badCard)" stroke="#EF4444" stroke-width="2" stroke-opacity="0.6"/>
    <rect x="20" y="20" width="180" height="28" rx="6" fill="#EF4444" fill-opacity="0.2"/>
    <text x="30" y="39" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="13" fill="#FCA5A5">LEGACY MONOLITH</text>
    <text x="20" y="75" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="17" fill="#FFFFFF">Perimeter-Only Vulnerability</text>

    <!-- Monolith Giant Box -->
    <rect x="35" y="100" width="360" height="150" rx="10" fill="#3B1822" stroke="#EF4444" stroke-dasharray="4,4"/>
    <text x="110" y="132" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="15" fill="#F87171">SINGLE MASSIVE CODEBASE</text>
    <text x="55" y="162" font-family="'Segoe UI', sans-serif" font-size="12" fill="#FECACA">• Hardcoded TLS, Auth &amp; Retry logic</text>
    <text x="55" y="185" font-family="'Segoe UI', sans-serif" font-size="12" fill="#FECACA">• Shared DB Locks &amp; Cascading Failures</text>
    <text x="55" y="208" font-family="'Segoe UI', sans-serif" font-size="12" fill="#FECACA">• Cleartext Internal HTTP (MITRE ATT&amp;CK T1021)</text>
    <text x="55" y="231" font-family="'Segoe UI', sans-serif" font-size="12" fill="#FECACA">• No Distributed Tracing or Tail Visibility</text>

    <!-- Warning Indicators -->
    <g transform="translate(35, 270)">
      <rect width="360" height="38" rx="8" fill="#450A0A" stroke="#B91C1C"/>
      <text x="15" y="24" font-family="'Segoe UI', sans-serif" font-size="12" fill="#FCA5A5">⚠ Latency Tails: p99 &gt; 120 ms under sudden spikes</text>
    </g>
    <g transform="translate(35, 320)">
      <rect width="360" height="38" rx="8" fill="#450A0A" stroke="#B91C1C"/>
      <text x="15" y="24" font-family="'Segoe UI', sans-serif" font-size="12" fill="#FCA5A5">⚠ Availability drops &lt;99.0% due to single pod crashes</text>
    </g>
    <g transform="translate(35, 370)">
      <rect width="360" height="28" rx="6" fill="#7F1D1D"/>
      <text x="65" y="19" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="12" fill="#FEE2E2">OBSERVABILITY BLACK HOLE</text>
    </g>
  </g>

  <!-- Right: Modern Cloud-Native Service Mesh -->
  <g transform="translate(500, 25)">
    <rect width="430" height="430" rx="14" fill="url(#goodCard)" stroke="#00F0FF" stroke-width="2" stroke-opacity="0.8"/>
    <rect x="20" y="20" width="220" height="28" rx="6" fill="#00F0FF" fill-opacity="0.2"/>
    <text x="30" y="39" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="13" fill="#38BDF8">CLOUD-NATIVE SERVICE MESH</text>
    <text x="20" y="75" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="17" fill="#FFFFFF">Decoupled Zero-Trust Architecture</text>

    <!-- Mesh Pods Grid -->
    <g transform="translate(25, 95)">
      <!-- Auth Pod -->
      <rect x="0" y="0" width="180" height="65" rx="8" fill="#0F2B48" stroke="#38BDF8"/>
      <text x="12" y="24" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="12" fill="#FFFFFF">Auth Service (Go)</text>
      <text x="12" y="44" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#34D399">🛡 Envoy Sidecar (:15001)</text>

      <!-- Flight Pod -->
      <rect x="200" y="0" width="180" height="65" rx="8" fill="#0F2B48" stroke="#38BDF8"/>
      <text x="12" y="24" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="12" fill="#FFFFFF">Flight Catalog (FastAPI)</text>
      <text x="12" y="44" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#34D399">🛡 Envoy Sidecar (:15001)</text>

      <!-- Booking Pod -->
      <rect x="0" y="80" width="180" height="65" rx="8" fill="#0F2B48" stroke="#38BDF8"/>
      <text x="12" y="24" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="12" fill="#FFFFFF">Booking Saga (Spring)</text>
      <text x="12" y="44" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#34D399">🛡 Envoy Sidecar (:15001)</text>

      <!-- Notify Pod -->
      <rect x="200" y="80" width="180" height="65" rx="8" fill="#0F2B48" stroke="#38BDF8"/>
      <text x="12" y="24" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="12" fill="#FFFFFF">Notification (Node.js)</text>
      <text x="12" y="44" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#34D399">🛡 Envoy Sidecar (:15001)</text>

      <!-- Inter-Pod Mutual TLS Arrows -->
      <line x1="90" y1="65" x2="90" y2="80" stroke="#10B981" stroke-width="2.5" stroke-dasharray="3,3"/>
      <line x1="180" y1="32" x2="200" y2="32" stroke="#10B981" stroke-width="2.5" stroke-dasharray="3,3"/>
      <line x1="180" y1="112" x2="200" y2="112" stroke="#10B981" stroke-width="2.5" stroke-dasharray="3,3"/>
    </g>

    <!-- Verified Achievements -->
    <g transform="translate(35, 270)">
      <rect width="360" height="38" rx="8" fill="#064E3B" stroke="#059669"/>
      <text x="15" y="24" font-family="'Segoe UI', sans-serif" font-size="12" fill="#A7F3D0">✔ 100% Inter-Pod TLS 1.3 Strict Mutual Authentication</text>
    </g>
    <g transform="translate(35, 320)">
      <rect width="360" height="38" rx="8" fill="#064E3B" stroke="#059669"/>
      <text x="15" y="24" font-family="'Segoe UI', sans-serif" font-size="12" fill="#A7F3D0">✔ 180ms Circuit Breaker Isolation &amp; Zero Dropped Bookings</text>
    </g>
    <g transform="translate(35, 370)">
      <rect width="360" height="28" rx="6" fill="#0284C7"/>
      <text x="35" y="19" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="12" fill="#FFFFFF">100% DECOUPLED NETWORKING &amp; OBSERVABILITY</text>
    </g>
  </g>
</svg>