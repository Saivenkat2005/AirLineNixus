<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="100%" height="auto" style="max-height: 230px; font-family: 'Times New Roman', serif;">
  <rect x="5" y="5" width="840" height="240" rx="6" fill="#FFFFFF" stroke="#CBD5E0" stroke-width="1.5"/>
  <rect x="5" y="5" width="840" height="26" rx="6" fill="#1A365D"/>
  <rect x="5" y="16" width="840" height="15" fill="#1A365D"/>
  <text x="425" y="21" fill="#FFFFFF" font-size="11.5" font-weight="bold" text-anchor="middle">FIGURE 4.7: LINUX NETWORK NAMESPACE &amp; IPTABLES PACKET REDIRECTION MECHANISM</text>

  <!-- Pod Network Namespace Box -->
  <g transform="translate(30, 42)">
    <rect width="780" height="185" rx="6" fill="#F7FAFC" stroke="#4A5568" stroke-width="1.5"/>
    <text x="390" y="20" fill="#2D3748" font-size="10" font-weight="bold" text-anchor="middle">POD NETWORK NAMESPACE (netns)</text>

    <!-- eth0 interface -->
    <rect x="15" y="34" width="90" height="40" rx="3" fill="#EDF2F7" stroke="#CBD5E0"/>
    <text x="60" y="58" fill="#1A365D" font-size="9" font-weight="bold" text-anchor="middle">eth0 (Veth Pair)</text>

    <!-- Inbound iptables PREROUTING -->
    <g transform="translate(130, 34)">
      <rect width="180" height="60" rx="4" fill="#EBF8FF" stroke="#3182CE"/>
      <text x="90" y="18" fill="#2B6CB0" font-size="8.5" font-weight="bold" text-anchor="middle">PREROUTING Chain (nat table)</text>
      <text x="90" y="34" fill="#4A5568" font-size="8" text-anchor="middle">-A PREROUTING -p tcp</text>
      <text x="90" y="48" fill="#C53030" font-size="8" font-weight="bold" text-anchor="middle">-j REDIRECT --to-ports 15006</text>
    </g>

    <!-- Arrow Inbound -->
    <path d="M 105 54 L 128 54" stroke="#3182CE" stroke-width="2"/>
    <polygon points="128,50 136,54 128,58" fill="#3182CE"/>

    <!-- Envoy Proxy Sidecar -->
    <g transform="translate(350, 34)">
      <rect width="210" height="130" rx="5" fill="#FFFFFF" stroke="#4A5568" stroke-width="1.5"/>
      <rect width="210" height="22" rx="5" fill="#4A5568"/>
      <text x="105" y="16" fill="#FFFFFF" font-size="9" font-weight="bold" text-anchor="middle">ENVOY PROXY (UID 1337)</text>
      <text x="105" y="42" fill="#2B6CB0" font-size="8" font-weight="bold" text-anchor="middle">Inbound Listener (:15006)</text>
      <text x="105" y="56" fill="#718096" font-size="7.5" text-anchor="middle">Terminates mTLS / Verifies SPIFFE</text>
      <text x="105" y="80" fill="#E53E3E" font-size="8" font-weight="bold" text-anchor="middle">Outbound Listener (:15001)</text>
      <text x="105" y="94" fill="#718096" font-size="7.5" text-anchor="middle">Encrypts mTLS / Circuit Breaking / Retries</text>
      <rect x="15" y="105" width="180" height="18" rx="2" fill="#EDF2F7"/>
      <text x="105" y="118" fill="#22543D" font-size="7" font-weight="bold" text-anchor="middle">Bypass UID 1337 to prevent loop</text>
    </g>

    <!-- Arrow to Envoy -->
    <path d="M 310 54 L 348 54" stroke="#3182CE" stroke-width="2"/>
    <polygon points="348,50 356,54 348,58" fill="#3182CE"/>

    <!-- Arrow Envoy to App Container -->
    <path d="M 560 54 L 600 54" stroke="#38A169" stroke-width="2"/>
    <polygon points="600,50 608,54 600,58" fill="#38A169"/>
    <text x="584" y="46" fill="#38A169" font-size="7" font-weight="bold">127.0.0.1</text>

    <!-- App Container -->
    <g transform="translate(610, 34)">
      <rect width="150" height="130" rx="4" fill="#FFFFFF" stroke="#38A169" stroke-width="1.2"/>
      <rect width="150" height="22" rx="4" fill="#38A169"/>
      <text x="75" y="16" fill="#FFFFFF" font-size="9" font-weight="bold" text-anchor="middle">Application Process</text>
      <text x="75" y="48" fill="#22543D" font-size="8.5" font-weight="bold" text-anchor="middle">Local Listening Port</text>
      <text x="75" y="66" fill="#4A5568" font-size="8" text-anchor="middle">e.g., 8001, 8002, 8003</text>
      <text x="75" y="86" fill="#718096" font-size="7.5" text-anchor="middle">Receives cleartext HTTP</text>
      <text x="75" y="98" fill="#718096" font-size="7.5" text-anchor="middle">from Envoy via localhost</text>
      <rect x="10" y="106" width="130" height="18" rx="2" fill="#E6FFFA"/>
      <text x="75" y="119" fill="#234E52" font-size="7" font-weight="bold" text-anchor="middle">Zero crypto overhead</text>
    </g>

    <!-- Outbound iptables OUTPUT -->
    <g transform="translate(130, 105)">
      <rect width="180" height="60" rx="4" fill="#FEFCBF" stroke="#D69E2E"/>
      <text x="90" y="18" fill="#744210" font-size="8.5" font-weight="bold" text-anchor="middle">OUTPUT Chain (nat table)</text>
      <text x="90" y="34" fill="#4A5568" font-size="8" text-anchor="middle">-m owner --uid-owner 1337 -j RETURN</text>
      <text x="90" y="48" fill="#C53030" font-size="8" font-weight="bold" text-anchor="middle">-j REDIRECT --to-ports 15001</text>
    </g>

    <!-- Arrow Outbound from App to OUTPUT -->
    <path d="M 685 164 L 685 180 L 220 180 L 220 165" stroke="#D69E2E" stroke-width="1.5" stroke-dasharray="3 3"/>
    <polygon points="216,165 220,157 224,165" fill="#D69E2E"/>

    <!-- Arrow OUTPUT to Envoy :15001 -->
    <path d="M 310 135 L 348 135" stroke="#D69E2E" stroke-width="2"/>
    <polygon points="348,131 356,135 348,139" fill="#D69E2E"/>
  </g>
</svg>