<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="100%" height="auto" style="max-height: 230px; font-family: 'Times New Roman', serif;">
  <rect x="5" y="5" width="840" height="240" rx="6" fill="#FFFFFF" stroke="#CBD5E0" stroke-width="1.5"/>
  <rect x="5" y="5" width="840" height="26" rx="6" fill="#1A365D"/>
  <rect x="5" y="16" width="840" height="15" fill="#1A365D"/>
  <text x="425" y="21" fill="#FFFFFF" font-size="11.5" font-weight="bold" text-anchor="middle">FIGURE 4.6: MULTI-NODE KUBERNETES DEPLOYMENT &amp; HIGH-AVAILABILITY TOPOLOGY</text>

  <!-- Physical Network Fabric -->
  <g transform="translate(20, 38)">
    <!-- Master Node -->
    <rect x="0" y="0" width="180" height="195" rx="5" fill="#EDF2F7" stroke="#A0AEC0"/>
    <rect x="0" y="0" width="180" height="22" rx="5" fill="#4A5568"/>
    <text x="90" y="15" fill="#FFFFFF" font-size="8.5" font-weight="bold" text-anchor="middle">CONTROL PLANE NODE</text>
    <text x="90" y="36" fill="#1A365D" font-size="8" font-weight="bold" text-anchor="middle">Ubuntu 22.04 LTS (x86_64)</text>
    <rect x="10" y="44" width="160" height="30" rx="3" fill="#FFFFFF" stroke="#CBD5E0"/>
    <text x="90" y="62" fill="#2D3748" font-size="7.5" text-anchor="middle">kube-apiserver &amp; etcd</text>
    <rect x="10" y="80" width="160" height="30" rx="3" fill="#FFFFFF" stroke="#CBD5E0"/>
    <text x="90" y="98" fill="#2D3748" font-size="7.5" text-anchor="middle">istiod Control Plane (Pilot/Citadel)</text>
    <rect x="10" y="116" width="160" height="30" rx="3" fill="#FFFFFF" stroke="#CBD5E0"/>
    <text x="90" y="134" fill="#2D3748" font-size="7.5" text-anchor="middle">CoreDNS &amp; Flannel CNI</text>
    <rect x="10" y="152" width="160" height="30" rx="3" fill="#FFFFFF" stroke="#CBD5E0"/>
    <text x="90" y="170" fill="#2D3748" font-size="7.5" text-anchor="middle">Prometheus &amp; Grafana Pods</text>

    <!-- Worker Node 1 -->
    <g transform="translate(200, 0)">
      <rect x="0" y="0" width="200" height="195" rx="5" fill="#EBF8FF" stroke="#3182CE"/>
      <rect x="0" y="0" width="200" height="22" rx="5" fill="#3182CE"/>
      <text x="100" y="15" fill="#FFFFFF" font-size="8.5" font-weight="bold" text-anchor="middle">WORKER NODE 1 (Zone A)</text>
      <text x="100" y="36" fill="#1A365D" font-size="8" font-weight="bold" text-anchor="middle">Primary Compute Worker</text>
      <rect x="10" y="44" width="180" height="30" rx="3" fill="#FFFFFF" stroke="#BEE3F8"/>
      <text x="100" y="62" fill="#2B6CB0" font-size="7.5" font-weight="bold" text-anchor="middle">Kong Ingress Gateway Pod</text>
      <rect x="10" y="80" width="180" height="30" rx="3" fill="#FFFFFF" stroke="#BEE3F8"/>
      <text x="100" y="62" fill="#2B6CB0" font-size="7.5" text-anchor="middle"></text>
      <text x="100" y="98" fill="#1A365D" font-size="7.5" text-anchor="middle">Auth Service Pod (v1) + Envoy</text>
      <rect x="10" y="116" width="180" height="30" rx="3" fill="#FFFFFF" stroke="#BEE3F8"/>
      <text x="100" y="134" fill="#1A365D" font-size="7.5" text-anchor="middle">Order Service Pod (v1) + Envoy</text>
      <rect x="10" y="152" width="180" height="30" rx="3" fill="#FFFFFF" stroke="#BEE3F8"/>
      <text x="100" y="170" fill="#718096" font-size="7.5" text-anchor="middle">PostgreSQL Database Primary</text>
    </g>

    <!-- Worker Node 2 -->
    <g transform="translate(420, 0)">
      <rect x="0" y="0" width="200" height="195" rx="5" fill="#F0FFF4" stroke="#38A169"/>
      <rect x="0" y="0" width="200" height="22" rx="5" fill="#38A169"/>
      <text x="100" y="15" fill="#FFFFFF" font-size="8.5" font-weight="bold" text-anchor="middle">WORKER NODE 2 (Zone B)</text>
      <text x="100" y="36" fill="#22543D" font-size="8" font-weight="bold" text-anchor="middle">Replica &amp; Anti-Affinity</text>
      <rect x="10" y="44" width="180" height="30" rx="3" fill="#FFFFFF" stroke="#9AE6B4"/>
      <text x="100" y="62" fill="#22543D" font-size="7.5" text-anchor="middle">Catalog Service Pod + Envoy</text>
      <rect x="10" y="80" width="180" height="30" rx="3" fill="#FFFFFF" stroke="#9AE6B4"/>
      <text x="100" y="98" fill="#22543D" font-size="7.5" text-anchor="middle">Order Service Replica (v2 Canary)</text>
      <rect x="10" y="116" width="180" height="30" rx="3" fill="#FFFFFF" stroke="#9AE6B4"/>
      <text x="100" y="134" fill="#22543D" font-size="7.5" text-anchor="middle">Notification Service Pod + Envoy</text>
      <rect x="10" y="152" width="180" height="30" rx="3" fill="#FFFFFF" stroke="#9AE6B4"/>
      <text x="100" y="170" fill="#718096" font-size="7.5" text-anchor="middle">Redis In-Memory Cache Pod</text>
    </g>

    <!-- Edge Client Node -->
    <g transform="translate(640, 0)">
      <rect x="0" y="0" width="160" height="195" rx="5" fill="#FFF5F5" stroke="#E53E3E"/>
      <rect x="0" y="0" width="160" height="22" rx="5" fill="#E53E3E"/>
      <text x="80" y="15" fill="#FFFFFF" font-size="8.5" font-weight="bold" text-anchor="middle">EDGE CLIENT NODE</text>
      <text x="80" y="36" fill="#9B2C2C" font-size="8" font-weight="bold" text-anchor="middle">Raspberry Pi 4 (4GB ARM64)</text>
      <rect x="10" y="44" width="140" height="42" rx="3" fill="#FFFFFF" stroke="#FEB2B2"/>
      <text x="70" y="60" fill="#C53030" font-size="7.5" font-weight="bold" text-anchor="middle">k6 Concurrency Engine</text>
      <text x="70" y="74" fill="#718096" font-size="7" text-anchor="middle">100 to 2,500 Virtual Users</text>
      <rect x="10" y="94" width="140" height="42" rx="3" fill="#FFFFFF" stroke="#FEB2B2"/>
      <text x="70" y="110" fill="#C53030" font-size="7.5" font-weight="bold" text-anchor="middle">Gigabit Ethernet Switch</text>
      <text x="70" y="124" fill="#718096" font-size="7" text-anchor="middle">Deterministic &lt;1ms wire</text>
      <rect x="10" y="144" width="140" height="38" rx="3" fill="#FFFFFF" stroke="#FEB2B2"/>
      <text x="70" y="160" fill="#22543D" font-size="7.5" font-weight="bold" text-anchor="middle">Low-Cost Testbed</text>
      <text x="70" y="172" fill="#718096" font-size="7" text-anchor="middle">Total Hardware: ₹10,300</text>
    </g>
  </g>
</svg>