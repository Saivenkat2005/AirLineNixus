<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="auto" style="max-height: 240px; font-family: 'Times New Roman', serif;">
  <rect x="5" y="5" width="840" height="250" rx="6" fill="#FFFFFF" stroke="#CBD5E0" stroke-width="1.5"/>
  <rect x="5" y="5" width="840" height="28" rx="6" fill="#1A365D"/>
  <rect x="5" y="18" width="840" height="15" fill="#1A365D"/>
  <text x="425" y="22" fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle">FIGURE 4.2: SAGA DISTRIBUTED CHECKOUT TRANSACTION WORKFLOW</text>

  <!-- Step 1 -->
  <g transform="translate(25, 45)">
    <rect width="170" height="185" rx="5" fill="#EBF8FF" stroke="#3182CE" stroke-width="1.5"/>
    <rect width="170" height="24" rx="5" fill="#3182CE"/>
    <rect y="14" width="170" height="10" fill="#3182CE"/>
    <text x="85" y="17" fill="#FFFFFF" font-size="10" font-weight="bold" text-anchor="middle">STEP 1: CREATE ORDER</text>
    <text x="85" y="48" fill="#1A365D" font-size="10" font-weight="bold" text-anchor="middle">Order Service (Orchestrator)</text>
    <rect x="12" y="62" width="146" height="52" rx="3" fill="#FFFFFF" stroke="#BEE3F8"/>
    <text x="85" y="80" fill="#2D3748" font-size="8.5" text-anchor="middle">Insert Order Record</text>
    <text x="85" y="96" fill="#2B6CB0" font-size="9" font-weight="bold" text-anchor="middle">Status: PENDING</text>
    <text x="85" y="136" fill="#4A5568" font-size="8" text-anchor="middle">Local ACID DB Transaction</text>
    <rect x="12" y="150" width="146" height="26" rx="3" fill="#EDF2F7"/>
    <text x="85" y="167" fill="#718096" font-size="8" text-anchor="middle">Order DB (PostgreSQL)</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 200 137 L 225 137" stroke="#3182CE" stroke-width="2"/>
  <polygon points="225,133 235,137 225,141" fill="#3182CE"/>
  <text x="215" y="128" fill="#3182CE" font-size="8" font-weight="bold" text-anchor="middle">gRPC</text>

  <!-- Step 2 -->
  <g transform="translate(240, 45)">
    <rect width="170" height="185" rx="5" fill="#FEFCBF" stroke="#D69E2E" stroke-width="1.5"/>
    <rect width="170" height="24" rx="5" fill="#D69E2E"/>
    <rect y="14" width="170" height="10" fill="#D69E2E"/>
    <text x="85" y="17" fill="#FFFFFF" font-size="10" font-weight="bold" text-anchor="middle">STEP 2: RESERVE STOCK</text>
    <text x="85" y="48" fill="#744210" font-size="10" font-weight="bold" text-anchor="middle">Catalog Service</text>
    <rect x="12" y="62" width="146" height="52" rx="3" fill="#FFFFFF" stroke="#F6E05E"/>
    <text x="85" y="80" fill="#2D3748" font-size="8.5" text-anchor="middle">Check &amp; Decrement SKU</text>
    <text x="85" y="96" fill="#B7791F" font-size="9" font-weight="bold" text-anchor="middle">Status: RESERVED</text>
    <rect x="12" y="122" width="146" height="24" rx="3" fill="#FFF5F5" stroke="#FEB2B2"/>
    <text x="85" y="138" fill="#C53030" font-size="7.5" font-weight="bold" text-anchor="middle">Compensate: RESTORE STOCK</text>
    <rect x="12" y="152" width="146" height="24" rx="3" fill="#EDF2F7"/>
    <text x="85" y="168" fill="#718096" font-size="8" text-anchor="middle">Catalog DB + Redis Cache</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 415 137 L 440 137" stroke="#D69E2E" stroke-width="2"/>
  <polygon points="440,133 450,137 440,141" fill="#D69E2E"/>

  <!-- Step 3 -->
  <g transform="translate(455, 45)">
    <rect width="170" height="185" rx="5" fill="#FAF5FF" stroke="#805AD5" stroke-width="1.5"/>
    <rect width="170" height="24" rx="5" fill="#805AD5"/>
    <rect y="14" width="170" height="10" fill="#805AD5"/>
    <text x="85" y="17" fill="#FFFFFF" font-size="10" font-weight="bold" text-anchor="middle">STEP 3: PROCESS PAYMENT</text>
    <text x="85" y="48" fill="#553C9A" font-size="10" font-weight="bold" text-anchor="middle">Payment Verification</text>
    <rect x="12" y="62" width="146" height="52" rx="3" fill="#FFFFFF" stroke="#D6BCFA"/>
    <text x="85" y="80" fill="#2D3748" font-size="8.5" text-anchor="middle">Simulated Auth Gateway</text>
    <text x="85" y="96" fill="#6B46C1" font-size="9" font-weight="bold" text-anchor="middle">Status: PAID / ABORT</text>
    <rect x="12" y="122" width="146" height="24" rx="3" fill="#FFF5F5" stroke="#FEB2B2"/>
    <text x="85" y="138" fill="#C53030" font-size="7.5" font-weight="bold" text-anchor="middle">If Fail ↳ TRIGGER ROLLBACK</text>
    <rect x="12" y="152" width="146" height="24" rx="3" fill="#EDF2F7"/>
    <text x="85" y="168" fill="#718096" font-size="8" text-anchor="middle">Token Verification</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 630 137 L 655 137" stroke="#38A169" stroke-width="2"/>
  <polygon points="655,133 665,137 655,141" fill="#38A169"/>
  <text x="645" y="128" fill="#38A169" font-size="8" font-weight="bold" text-anchor="middle">Async</text>

  <!-- Step 4 -->
  <g transform="translate(670, 45)">
    <rect width="155" height="185" rx="5" fill="#F0FFF4" stroke="#38A169" stroke-width="1.5"/>
    <rect width="155" height="24" rx="5" fill="#38A169"/>
    <rect y="14" width="155" height="10" fill="#38A169"/>
    <text x="77" y="17" fill="#FFFFFF" font-size="10" font-weight="bold" text-anchor="middle">STEP 4: NOTIFY</text>
    <text x="77" y="48" fill="#22543D" font-size="10" font-weight="bold" text-anchor="middle">Notification Service</text>
    <rect x="10" y="62" width="135" height="52" rx="3" fill="#FFFFFF" stroke="#9AE6B4"/>
    <text x="77" y="80" fill="#2D3748" font-size="8.5" text-anchor="middle">Order Confirmed Event</text>
    <text x="77" y="96" fill="#276749" font-size="9" font-weight="bold" text-anchor="middle">Status: COMPLETE</text>
    <text x="77" y="136" fill="#4A5568" font-size="8" text-anchor="middle">WebSocket / Email Dispatch</text>
    <rect x="10" y="152" width="135" height="24" rx="3" fill="#EDF2F7"/>
    <text x="77" y="168" fill="#718096" font-size="8" text-anchor="middle">Zero Inventory Drift</text>
  </g>
</svg>