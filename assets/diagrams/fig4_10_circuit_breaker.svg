<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="auto" style="max-height: 220px; font-family: 'Times New Roman', serif;">
  <rect x="5" y="5" width="840" height="230" rx="6" fill="#FFFFFF" stroke="#CBD5E0" stroke-width="1.5"/>
  <rect x="5" y="5" width="840" height="26" rx="6" fill="#1A365D"/>
  <rect x="5" y="16" width="840" height="15" fill="#1A365D"/>
  <text x="425" y="21" fill="#FFFFFF" font-size="11.5" font-weight="bold" text-anchor="middle">FIGURE 4.10: ENVOY CIRCUIT BREAKER OUTLIER DETECTION STATE MACHINE</text>

  <!-- State 1: Closed -->
  <g transform="translate(30, 60)">
    <rect width="210" height="145" rx="6" fill="#F0FFF4" stroke="#38A169" stroke-width="2"/>
    <rect width="210" height="24" rx="6" fill="#38A169"/>
    <text x="105" y="17" fill="#FFFFFF" font-size="10" font-weight="bold" text-anchor="middle">STATE: CLOSED (HEALTHY)</text>
    <text x="105" y="48" fill="#22543D" font-size="9" font-weight="bold" text-anchor="middle">Normal Traffic Flow</text>
    <text x="105" y="68" fill="#4A5568" font-size="8" text-anchor="middle">• All backend endpoints active</text>
    <text x="105" y="84" fill="#4A5568" font-size="8" text-anchor="middle">• 100% requests routed to pool</text>
    <text x="105" y="100" fill="#4A5568" font-size="8" text-anchor="middle">• Consecutive 5xx counter: 0</text>
    <rect x="15" y="112" width="180" height="22" rx="3" fill="#FFFFFF" stroke="#9AE6B4"/>
    <text x="105" y="127" fill="#22543D" font-size="7.5" font-weight="bold" text-anchor="middle">Availability: 99.98%</text>
  </g>

  <!-- Transition Closed -> Open -->
  <g transform="translate(245, 75)">
    <path d="M 0 20 L 115 20" stroke="#E53E3E" stroke-width="2.5"/>
    <polygon points="115,16 125,20 115,24" fill="#E53E3E"/>
    <text x="60" y="12" fill="#C53030" font-size="8" font-weight="bold" text-anchor="middle">3 consecutive 5xx errors</text>
    <text x="60" y="36" fill="#718096" font-size="7.5" text-anchor="middle">Ejected within 180 ms</text>
  </g>

  <!-- State 2: Open -->
  <g transform="translate(375, 60)">
    <rect width="210" height="145" rx="6" fill="#FFF5F5" stroke="#E53E3E" stroke-width="2"/>
    <rect width="210" height="24" rx="6" fill="#E53E3E"/>
    <text x="105" y="17" fill="#FFFFFF" font-size="10" font-weight="bold" text-anchor="middle">STATE: OPEN (TRIPPED)</text>
    <text x="105" y="48" fill="#9B2C2C" font-size="9" font-weight="bold" text-anchor="middle">Failing Pod Ejected</text>
    <text x="105" y="68" fill="#4A5568" font-size="8" text-anchor="middle">• Faulty replica removed from pool</text>
    <text x="105" y="84" fill="#4A5568" font-size="8" text-anchor="middle">• Immediate fallback / retry</text>
    <text x="105" y="100" fill="#4A5568" font-size="8" text-anchor="middle">• Prevents cascading thread lock</text>
    <rect x="15" y="112" width="180" height="22" rx="3" fill="#FFFFFF" stroke="#FEB2B2"/>
    <text x="105" y="127" fill="#C53030" font-size="7.5" font-weight="bold" text-anchor="middle">baseEjectionTime: 30s</text>
  </g>

  <!-- Transition Open -> Half-Open -->
  <g transform="translate(480, 208)">
    <path d="M 0 0 L 0 15 L 235 15 L 235 -3" stroke="#D69E2E" stroke-width="2"/>
    <polygon points="231,-3 235,-11 239,-3" fill="#D69E2E"/>
    <text x="117" y="12" fill="#D69E2E" font-size="7.5" font-weight="bold" text-anchor="middle">After 30s ejection window elapses</text>
  </g>

  <!-- State 3: Half-Open -->
  <g transform="translate(615, 60)">
    <rect width="205" height="145" rx="6" fill="#FEFCBF" stroke="#D69E2E" stroke-width="2"/>
    <rect width="205" height="24" rx="6" fill="#D69E2E"/>
    <text x="102" y="17" fill="#FFFFFF" font-size="10" font-weight="bold" text-anchor="middle">STATE: HALF-OPEN (PROBING)</text>
    <text x="102" y="48" fill="#744210" font-size="9" font-weight="bold" text-anchor="middle">Trial Request Canary</text>
    <text x="102" y="68" fill="#4A5568" font-size="8" text-anchor="middle">• Envoy dispatches probe probe</text>
    <text x="102" y="84" fill="#4A5568" font-size="8" text-anchor="middle">• If probe 200 OK ↳ Reset to Closed</text>
    <text x="102" y="100" fill="#4A5568" font-size="8" text-anchor="middle">• If probe 5xx ↳ Re-eject 60s</text>
    <rect x="15" y="112" width="175" height="22" rx="3" fill="#FFFFFF" stroke="#F6E05E"/>
    <text x="102" y="127" fill="#975A16" font-size="7.5" font-weight="bold" text-anchor="middle">Automated Self-Healing</text>
  </g>

  <!-- Transition Half-Open -> Closed -->
  <g transform="translate(135, 45)">
    <path d="M 580 0 L 0 0" stroke="#38A169" stroke-width="2"/>
    <polygon points="8,-4 0,0 8,4" fill="#38A169"/>
    <text x="290" y="-5" fill="#38A169" font-size="8" font-weight="bold" text-anchor="middle">Probe Success ↳ Re-join Pool</text>
  </g>
</svg>