<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="auto" style="max-height: 190px; font-family: 'Times New Roman', serif;">
  <rect x="5" y="5" width="840" height="190" rx="6" fill="#FFFFFF" stroke="#CBD5E0" stroke-width="1.5"/>
  <rect x="5" y="5" width="840" height="26" rx="6" fill="#1A365D"/>
  <rect x="5" y="16" width="840" height="15" fill="#1A365D"/>
  <text x="425" y="21" fill="#FFFFFF" font-size="11.5" font-weight="bold" text-anchor="middle">FIGURE 5.1: AUTOMATED CI/CD GITOPS PIPELINE VIA GITHUB ACTIONS AND ARGOCD</text>

  <!-- 5 Stages -->
  <g transform="translate(15, 40)">
    <!-- 1. Developer Git Push -->
    <rect x="0" y="0" width="145" height="135" rx="5" fill="#EDF2F7" stroke="#CBD5E0"/>
    <rect x="0" y="0" width="145" height="22" rx="5" fill="#4A5568"/>
    <text x="72" y="15" fill="#FFFFFF" font-size="8.5" font-weight="bold" text-anchor="middle">1. Git Push / PR</text>
    <text x="72" y="42" fill="#1A365D" font-size="8.5" font-weight="bold" text-anchor="middle">Monorepo Source</text>
    <text x="72" y="60" fill="#4A5568" font-size="8" text-anchor="middle">• Git branch: main</text>
    <text x="72" y="76" fill="#4A5568" font-size="8" text-anchor="middle">• 4 Microservices</text>
    <text x="72" y="92" fill="#4A5568" font-size="8" text-anchor="middle">• K8s Manifests &amp; Helm</text>
    <rect x="8" y="104" width="129" height="22" rx="3" fill="#FFFFFF"/>
    <text x="72" y="119" fill="#2B6CB0" font-size="7.5" font-weight="bold" text-anchor="middle">Automated Webhook</text>

    <!-- Arrow 1 -> 2 -->
    <path d="M 148 68 L 168 68" stroke="#3182CE" stroke-width="2"/>
    <polygon points="168,64 176,68 168,72" fill="#3182CE"/>

    <!-- 2. GitHub Actions CI -->
    <g transform="translate(178, 0)">
      <rect x="0" y="0" width="155" height="135" rx="5" fill="#EBF8FF" stroke="#3182CE"/>
      <rect x="0" y="0" width="155" height="22" rx="5" fill="#3182CE"/>
      <text x="77" y="15" fill="#FFFFFF" font-size="8.5" font-weight="bold" text-anchor="middle">2. GitHub Actions CI</text>
      <text x="77" y="42" fill="#1A365D" font-size="8" font-weight="bold" text-anchor="middle">Automated Validation</text>
      <text x="77" y="58" fill="#4A5568" font-size="7.5" text-anchor="middle">• Unit Tests (Go, PyTest, JUnit)</text>
      <text x="77" y="72" fill="#4A5568" font-size="7.5" text-anchor="middle">• Multi-stage Docker Builds</text>
      <text x="77" y="86" fill="#4A5568" font-size="7.5" text-anchor="middle">• Distroless Image &lt;65MB</text>
      <rect x="8" y="100" width="139" height="26" rx="3" fill="#FFFFFF" stroke="#BEE3F8"/>
      <text x="77" y="114" fill="#22543D" font-size="7.5" font-weight="bold" text-anchor="middle">Trivy Scan: 0 High/Crit</text>
      <text x="77" y="123" fill="#718096" font-size="6.5" text-anchor="middle">Pass Gate</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <path d="M 336 68 L 356 68" stroke="#3182CE" stroke-width="2"/>
    <polygon points="356,64 364,68 356,72" fill="#3182CE"/>

    <!-- 3. Registry Push -->
    <g transform="translate(366, 0)">
      <rect x="0" y="0" width="135" height="135" rx="5" fill="#FEFCBF" stroke="#D69E2E"/>
      <rect x="0" y="0" width="135" height="22" rx="5" fill="#D69E2E"/>
      <text x="67" y="15" fill="#FFFFFF" font-size="8.5" font-weight="bold" text-anchor="middle">3. Image Registry</text>
      <text x="67" y="42" fill="#744210" font-size="8.5" font-weight="bold" text-anchor="middle">Docker Hub / GHCR</text>
      <text x="67" y="60" fill="#4A5568" font-size="8" text-anchor="middle">• Pinned by SHA-256</text>
      <text x="67" y="76" fill="#4A5568" font-size="8" text-anchor="middle">• Multi-Arch Manifests</text>
      <text x="67" y="92" fill="#4A5568" font-size="8" text-anchor="middle">• linux/amd64 + arm64</text>
      <rect x="8" y="104" width="119" height="22" rx="3" fill="#FFFFFF"/>
      <text x="67" y="119" fill="#975A16" font-size="7.5" font-weight="bold" text-anchor="middle">Git Commit Tagged</text>
    </g>

    <!-- Arrow 3 -> 4 -->
    <path d="M 504 68 L 524 68" stroke="#D69E2E" stroke-width="2"/>
    <polygon points="524,64 532,68 524,72" fill="#D69E2E"/>

    <!-- 4. ArgoCD Reconciliation -->
    <g transform="translate(534, 0)">
      <rect x="0" y="0" width="145" height="135" rx="5" fill="#FAF5FF" stroke="#805AD5"/>
      <rect x="0" y="0" width="145" height="22" rx="5" fill="#805AD5"/>
      <text x="72" y="15" fill="#FFFFFF" font-size="8.5" font-weight="bold" text-anchor="middle">4. ArgoCD GitOps</text>
      <text x="72" y="42" fill="#553C9A" font-size="8.5" font-weight="bold" text-anchor="middle">Declarative Sync</text>
      <text x="72" y="60" fill="#4A5568" font-size="8" text-anchor="middle">• Polls Git state (3m)</text>
      <text x="72" y="76" fill="#4A5568" font-size="8" text-anchor="middle">• Detects drift in CRDs</text>
      <text x="72" y="92" fill="#4A5568" font-size="8" text-anchor="middle">• Helm Chart render</text>
      <rect x="8" y="104" width="129" height="22" rx="3" fill="#FFFFFF"/>
      <text x="72" y="119" fill="#6B46C1" font-size="7.5" font-weight="bold" text-anchor="middle">Auto-Sync Enabled</text>
    </g>

    <!-- Arrow 4 -> 5 -->
    <path d="M 682 68 L 702 68" stroke="#805AD5" stroke-width="2"/>
    <polygon points="702,64 710,68 702,72" fill="#805AD5"/>

    <!-- 5. Kubernetes Deployment -->
    <g transform="translate(712, 0)">
      <rect x="0" y="0" width="115" height="135" rx="5" fill="#F0FFF4" stroke="#38A169"/>
      <rect x="0" y="0" width="115" height="22" rx="5" fill="#38A169"/>
      <text x="57" y="15" fill="#FFFFFF" font-size="8.5" font-weight="bold" text-anchor="middle">5. K8s Production</text>
      <text x="57" y="42" fill="#22543D" font-size="8.5" font-weight="bold" text-anchor="middle">Rolling Update</text>
      <text x="57" y="60" fill="#4A5568" font-size="8" text-anchor="middle">• Zero Downtime</text>
      <text x="57" y="76" fill="#4A5568" font-size="8" text-anchor="middle">• Envoy Sidecars</text>
      <text x="57" y="92" fill="#4A5568" font-size="8" text-anchor="middle">• 90/10 Canary</text>
      <rect x="6" y="104" width="103" height="22" rx="3" fill="#FFFFFF"/>
      <text x="57" y="119" fill="#22543D" font-size="7.5" font-weight="bold" text-anchor="middle">v1.0.0 Live</text>
    </g>
  </g>
</svg>