<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="auto" style="max-height: 440px; font-family: 'Times New Roman', serif;">
  <rect x="5" y="5" width="890" height="470" rx="6" fill="#F8FAFC" stroke="#CBD5E0" stroke-width="1.5"/>
  <rect x="5" y="5" width="890" height="32" rx="6" fill="#1A365D"/>
  <rect x="5" y="20" width="890" height="17" fill="#1A365D"/>
  <text x="450" y="25" fill="#FFFFFF" font-size="13" font-weight="bold" text-anchor="middle">FIGURE 4.1: C4 CONTAINER-LEVEL ARCHITECTURE TOPOLOGY</text>

  <!-- External Clients Zone -->
  <g transform="translate(15, 48)">
    <rect width="130" height="415" rx="5" fill="#EDF2F7" stroke="#CBD5E0" stroke-dasharray="4 4"/>
    <text x="65" y="20" fill="#2D3748" font-size="10.5" font-weight="bold" text-anchor="middle">EXTERNAL CLIENTS</text>
    
    <rect x="10" y="40" width="110" height="70" rx="4" fill="#FFFFFF" stroke="#A0AEC0"/>
    <text x="65" y="65" fill="#1A365D" font-size="9.5" font-weight="bold" text-anchor="middle">Web / Mobile Apps</text>
    <text x="65" y="80" fill="#718096" font-size="8" text-anchor="middle">HTTPS / JSON Clients</text>
    <text x="65" y="95" fill="#2B6CB0" font-size="8" text-anchor="middle">Port 443 Bearer JWT</text>

    <rect x="10" y="130" width="110" height="70" rx="4" fill="#FFFFFF" stroke="#A0AEC0"/>
    <text x="65" y="155" fill="#1A365D" font-size="9.5" font-weight="bold" text-anchor="middle">Raspberry Pi 4 Client</text>
    <text x="65" y="170" fill="#718096" font-size="8" text-anchor="middle">k6 Load Generator</text>
    <text x="65" y="185" fill="#C53030" font-size="8" text-anchor="middle">100–2,500 VUs</text>
  </g>

  <!-- Kubernetes Cluster Boundary -->
  <g transform="translate(160, 48)">
    <rect width="725" height="415" rx="6" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="1.8"/>
    <rect width="725" height="24" rx="6" fill="#2B6CB0"/>
    <rect y="14" width="725" height="10" fill="#2B6CB0"/>
    <text x="362" y="17" fill="#FFFFFF" font-size="10.5" font-weight="bold" text-anchor="middle">KUBERNETES CLUSTER (ORCHESTRATION &amp; SERVICE MESH BOUNDARY)</text>

    <!-- Kong API Gateway -->
    <g transform="translate(15, 34)">
      <rect width="145" height="365" rx="5" fill="#EBF8FF" stroke="#3182CE"/>
      <text x="72" y="20" fill="#2B6CB0" font-size="10" font-weight="bold" text-anchor="middle">API GATEWAY</text>
      <text x="72" y="34" fill="#4A5568" font-size="8.5" text-anchor="middle">(Kong DB-less Ingress)</text>

      <rect x="8" y="50" width="129" height="45" rx="3" fill="#FFFFFF" stroke="#BEE3F8"/>
      <text x="72" y="68" fill="#1A365D" font-size="8" font-weight="bold" text-anchor="middle">TLS 1.3 Termination</text>
      <text x="72" y="82" fill="#718096" font-size="7.5" text-anchor="middle">ECDHE-ECDSA Cipher</text>

      <rect x="8" y="105" width="129" height="45" rx="3" fill="#FFFFFF" stroke="#BEE3F8"/>
      <text x="72" y="123" fill="#1A365D" font-size="8" font-weight="bold" text-anchor="middle">Token-Bucket Rate Limit</text>
      <text x="72" y="137" fill="#718096" font-size="7.5" text-anchor="middle">100 req/min/IP (Redis)</text>

      <rect x="8" y="160" width="129" height="45" rx="3" fill="#FFFFFF" stroke="#BEE3F8"/>
      <text x="72" y="178" fill="#1A365D" font-size="8" font-weight="bold" text-anchor="middle">JWT Verification</text>
      <text x="72" y="192" fill="#718096" font-size="7.5" text-anchor="middle">RS256 Public Key</text>

      <rect x="8" y="215" width="129" height="45" rx="3" fill="#FFFFFF" stroke="#BEE3F8"/>
      <text x="72" y="233" fill="#1A365D" font-size="8" font-weight="bold" text-anchor="middle">Path-Based Routing</text>
      <text x="72" y="247" fill="#718096" font-size="7.5" text-anchor="middle">L7 Upstream Dispatch</text>

      <rect x="8" y="270" width="129" height="45" rx="3" fill="#FFFFFF" stroke="#BEE3F8"/>
      <text x="72" y="288" fill="#1A365D" font-size="8" font-weight="bold" text-anchor="middle">W3C Header Inject</text>
      <text x="72" y="302" fill="#718096" font-size="7.5" text-anchor="middle">traceparent &amp; req-id</text>
    </g>

    <!-- Istio Mesh Zone -->
    <g transform="translate(175, 34)">
      <rect width="365" height="365" rx="5" fill="#F0FFF4" stroke="#38A169"/>
      <text x="182" y="20" fill="#22543D" font-size="10" font-weight="bold" text-anchor="middle">ISTIO SERVICE MESH (EAST-WEST mTLS ZERO-TRUST ZONE)</text>

      <!-- istiod Control plane banner -->
      <rect x="10" y="30" width="345" height="28" rx="3" fill="#C6F6D5" stroke="#38A169"/>
      <text x="182" y="48" fill="#22543D" font-size="8.5" font-weight="bold" text-anchor="middle">Control Plane: istiod v1.22.0 (Pilot xDS | Citadel SPIFFE CA | Galley)</text>

      <!-- 4 Services -->
      <g transform="translate(10, 68)">
        <rect width="345" height="52" rx="4" fill="#FFFFFF" stroke="#CBD5E0"/>
        <rect width="45" height="52" rx="4" fill="#4A5568"/>
        <text x="22" y="28" fill="#FFFFFF" font-size="8.5" font-weight="bold" text-anchor="middle">Envoy</text>
        <text x="22" y="40" fill="#A0AEC0" font-size="7" text-anchor="middle">:15001</text>
        <text x="55" y="22" fill="#1A365D" font-size="9" font-weight="bold">Auth Service (Go 1.22.2) [Port 8001]</text>
        <text x="55" y="36" fill="#718096" font-size="8">BCrypt Hash (Cost 12) | RS256 JWT Issuance</text>
        <text x="55" y="46" fill="#2B6CB0" font-size="7.5">SPIFFE ID: spiffe://cluster.local/ns/prod/sa/auth-sa</text>
      </g>

      <g transform="translate(10, 126)">
        <rect width="345" height="52" rx="4" fill="#FFFFFF" stroke="#CBD5E0"/>
        <rect width="45" height="52" rx="4" fill="#4A5568"/>
        <text x="22" y="28" fill="#FFFFFF" font-size="8.5" font-weight="bold" text-anchor="middle">Envoy</text>
        <text x="22" y="40" fill="#A0AEC0" font-size="7" text-anchor="middle">:15001</text>
        <text x="55" y="22" fill="#1A365D" font-size="9" font-weight="bold">Catalog Service (Python FastAPI) [Port 8002]</text>
        <text x="55" y="36" fill="#718096" font-size="8">Product Inventory | Write-Through Redis Cache</text>
        <text x="55" y="46" fill="#2B6CB0" font-size="7.5">SPIFFE ID: spiffe://cluster.local/ns/prod/sa/catalog-sa</text>
      </g>

      <g transform="translate(10, 184)">
        <rect width="345" height="52" rx="4" fill="#FFFFFF" stroke="#CBD5E0"/>
        <rect width="45" height="52" rx="4" fill="#4A5568"/>
        <text x="22" y="28" fill="#FFFFFF" font-size="8.5" font-weight="bold" text-anchor="middle">Envoy</text>
        <text x="22" y="40" fill="#A0AEC0" font-size="7" text-anchor="middle">:15001</text>
        <text x="55" y="22" fill="#1A365D" font-size="9" font-weight="bold">Order Service (Java Spring Boot 3.2) [Port 8003]</text>
        <text x="55" y="36" fill="#718096" font-size="8">Saga Orchestrator | Circuit Breaker (Outlier Detection)</text>
        <text x="55" y="46" fill="#2B6CB0" font-size="7.5">SPIFFE ID: spiffe://cluster.local/ns/prod/sa/order-sa</text>
      </g>

      <g transform="translate(10, 242)">
        <rect width="345" height="52" rx="4" fill="#FFFFFF" stroke="#CBD5E0"/>
        <rect width="45" height="52" rx="4" fill="#4A5568"/>
        <text x="22" y="28" fill="#FFFFFF" font-size="8.5" font-weight="bold" text-anchor="middle">Envoy</text>
        <text x="22" y="40" fill="#A0AEC0" font-size="7" text-anchor="middle">:15001</text>
        <text x="55" y="22" fill="#1A365D" font-size="9" font-weight="bold">Notification Service (Node.js 20) [Port 8004]</text>
        <text x="55" y="36" fill="#718096" font-size="8">Async Event Queue | WebSockets &amp; Webhooks</text>
        <text x="55" y="46" fill="#2B6CB0" font-size="7.5">SPIFFE ID: spiffe://cluster.local/ns/prod/sa/notify-sa</text>
      </g>

      <!-- mTLS and Canary footer in mesh -->
      <rect x="10" y="302" width="345" height="50" rx="4" fill="#E6FFFA" stroke="#319795"/>
      <text x="182" y="320" fill="#234E52" font-size="8.5" font-weight="bold" text-anchor="middle">Zero-Trust Security &amp; Dynamic Routing Policies</text>
      <text x="182" y="334" fill="#285E61" font-size="8" text-anchor="middle">100% Strict mTLS via SPIFFE X.509 | VirtualService Canary 90/10 Split</text>
      <text x="182" y="344" fill="#718096" font-size="7.5" text-anchor="middle">Envoy Outlier Detection: 3 consecutive 5xx ejections in 180ms</text>
    </g>

    <!-- Data Stores & Observability Column -->
    <g transform="translate(555, 34)">
      <!-- Data Stores -->
      <rect width="155" height="175" rx="5" fill="#FFFAF0" stroke="#DD6B20"/>
      <text x="77" y="20" fill="#9C4221" font-size="10" font-weight="bold" text-anchor="middle">DATA STORES</text>
      
      <rect x="8" y="34" width="139" height="58" rx="3" fill="#FFFFFF" stroke="#FBD38D"/>
      <text x="77" y="52" fill="#7B341E" font-size="8.5" font-weight="bold" text-anchor="middle">PostgreSQL Pods</text>
      <text x="77" y="66" fill="#4A5568" font-size="7.5" text-anchor="middle">Database-per-Service</text>
      <text x="77" y="78" fill="#718096" font-size="7.5" text-anchor="middle">ACID Relational PVC 20Gi</text>

      <rect x="8" y="100" width="139" height="58" rx="3" fill="#FFFFFF" stroke="#FBD38D"/>
      <text x="77" y="118" fill="#7B341E" font-size="8.5" font-weight="bold" text-anchor="middle">Redis Cache Pod</text>
      <text x="77" y="132" fill="#4A5568" font-size="7.5" text-anchor="middle">In-Memory Key-Value</text>
      <text x="77" y="144" fill="#718096" font-size="7.5" text-anchor="middle">Sub-3ms Query Latency</text>

      <!-- Observability Stack -->
      <g transform="translate(0, 185)">
        <rect width="155" height="180" rx="5" fill="#FAF5FF" stroke="#805AD5"/>
        <text x="77" y="20" fill="#553C9A" font-size="10" font-weight="bold" text-anchor="middle">OBSERVABILITY</text>

        <rect x="8" y="32" width="139" height="40" rx="3" fill="#FFFFFF" stroke="#D6BCFA"/>
        <text x="77" y="48" fill="#44337A" font-size="8" font-weight="bold" text-anchor="middle">Prometheus v2.51</text>
        <text x="77" y="62" fill="#718096" font-size="7.5" text-anchor="middle">Scrapes Envoy :15090 (15s)</text>

        <rect x="8" y="78" width="139" height="40" rx="3" fill="#FFFFFF" stroke="#D6BCFA"/>
        <text x="77" y="94" fill="#44337A" font-size="8" font-weight="bold" text-anchor="middle">Grafana v10.4</text>
        <text x="77" y="108" fill="#718096" font-size="7.5" text-anchor="middle">p50/p90/p99 Latency Panels</text>

        <rect x="8" y="124" width="139" height="45" rx="3" fill="#FFFFFF" stroke="#D6BCFA"/>
        <text x="77" y="140" fill="#44337A" font-size="8" font-weight="bold" text-anchor="middle">Jaeger v1.55</text>
        <text x="77" y="154" fill="#718096" font-size="7.5" text-anchor="middle">W3C Distributed Tracing</text>
        <text x="77" y="164" fill="#2B6CB0" font-size="7" text-anchor="middle">100% Span Propagation</text>
      </g>
    </g>
  </g>
</svg>