<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="auto" style="max-height: 240px; font-family: 'Times New Roman', serif;">
  <rect x="5" y="5" width="840" height="250" rx="6" fill="#FFFFFF" stroke="#CBD5E0" stroke-width="1.5"/>
  <rect x="5" y="5" width="840" height="26" rx="6" fill="#1A365D"/>
  <rect x="5" y="16" width="840" height="15" fill="#1A365D"/>
  <text x="425" y="21" fill="#FFFFFF" font-size="11.5" font-weight="bold" text-anchor="middle">FIGURE 4.5: END-TO-END CHECKOUT REQUEST SEQUENCE DIAGRAM</text>

  <!-- Lifelines -->
  <g transform="translate(40, 38)">
    <!-- Actors -->
    <rect x="0" y="0" width="80" height="25" rx="3" fill="#EDF2F7" stroke="#CBD5E0"/>
    <text x="40" y="16" fill="#2D3748" font-size="8.5" font-weight="bold" text-anchor="middle">Client (k6/Web)</text>
    <line x1="40" y1="25" x2="40" y2="195" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="4 4"/>

    <rect x="150" y="0" width="95" height="25" rx="3" fill="#EBF8FF" stroke="#3182CE"/>
    <text x="197" y="16" fill="#2B6CB0" font-size="8.5" font-weight="bold" text-anchor="middle">Kong Ingress</text>
    <line x1="197" y1="25" x2="197" y2="195" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="4 4"/>

    <rect x="310" y="0" width="100" height="25" rx="3" fill="#F0FFF4" stroke="#38A169"/>
    <text x="360" y="16" fill="#22543D" font-size="8.5" font-weight="bold" text-anchor="middle">Order Service (8003)</text>
    <line x1="360" y1="25" x2="360" y2="195" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="4 4"/>

    <rect x="475" y="0" width="105" height="25" rx="3" fill="#FEFCBF" stroke="#D69E2E"/>
    <text x="527" y="16" fill="#744210" font-size="8.5" font-weight="bold" text-anchor="middle">Catalog Service (8002)</text>
    <line x1="527" y1="25" x2="527" y2="195" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="4 4"/>

    <rect x="645" y="0" width="115" height="25" rx="3" fill="#FAF5FF" stroke="#805AD5"/>
    <text x="702" y="16" fill="#553C9A" font-size="8.5" font-weight="bold" text-anchor="middle">Notification (8004)</text>
    <line x1="702" y1="25" x2="702" y2="195" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="4 4"/>

    <!-- Messages -->
    <!-- 1. Client -> Gateway -->
    <path d="M 40 45 L 197 45" stroke="#2B6CB0" stroke-width="1.5"/>
    <polygon points="197,42 205,45 197,48" fill="#2B6CB0"/>
    <text x="115" y="40" fill="#2B6CB0" font-size="7.5" font-weight="bold" text-anchor="middle">1. POST /api/v1/orders (Bearer JWT)</text>

    <!-- Gateway processing self call -->
    <rect x="195" y="48" width="5" height="22" fill="#3182CE"/>
    <text x="206" y="58" fill="#718096" font-size="7">TLS Term + RateLimit + JWT Verify</text>

    <!-- 2. Gateway -> Order Service -->
    <path d="M 197 75 L 360 75" stroke="#38A169" stroke-width="1.5"/>
    <polygon points="360,72 368,75 360,78" fill="#38A169"/>
    <text x="275" y="70" fill="#22543D" font-size="7.5" font-weight="bold" text-anchor="middle">2. Forward via Envoy mTLS (traceparent)</text>

    <!-- 3. Order -> Catalog Service gRPC -->
    <path d="M 360 98 L 527 98" stroke="#D69E2E" stroke-width="1.5"/>
    <polygon points="527,95 535,98 527,101" fill="#D69E2E"/>
    <text x="445" y="93" fill="#744210" font-size="7.5" font-weight="bold" text-anchor="middle">3. gRPC ReserveStock(SKU, Qty)</text>

    <!-- Catalog internal check -->
    <rect x="525" y="100" width="5" height="20" fill="#D69E2E"/>
    <text x="536" y="110" fill="#718096" font-size="7">Redis Check + Postgres Decr</text>

    <!-- 4. Catalog -> Order ack -->
    <path d="M 527 125 L 360 125" stroke="#38A169" stroke-width="1.5" stroke-dasharray="3 3"/>
    <polygon points="360,122 352,125 360,128" fill="#38A169"/>
    <text x="445" y="120" fill="#22543D" font-size="7.5" font-weight="bold" text-anchor="middle">4. StockReserved (OK)</text>

    <!-- 5. Order -> Notify async event -->
    <path d="M 360 148 L 702 148" stroke="#805AD5" stroke-width="1.5"/>
    <polygon points="702,145 710,148 702,151" fill="#805AD5"/>
    <text x="530" y="143" fill="#553C9A" font-size="7.5" font-weight="bold" text-anchor="middle">5. Async Publish OrderCreatedEvent</text>

    <!-- 6. Order -> Gateway 201 Created -->
    <path d="M 360 170 L 197 170" stroke="#38A169" stroke-width="1.5" stroke-dasharray="3 3"/>
    <polygon points="197,167 189,170 197,173" fill="#38A169"/>
    <text x="275" y="165" fill="#22543D" font-size="7.5" font-weight="bold" text-anchor="middle">6. HTTP 201 Created (Order ID)</text>

    <!-- 7. Gateway -> Client -->
    <path d="M 197 190 L 40 190" stroke="#2B6CB0" stroke-width="1.5" stroke-dasharray="3 3"/>
    <polygon points="40,187 32,190 40,193" fill="#2B6CB0"/>
    <text x="115" y="185" fill="#2B6CB0" font-size="7.5" font-weight="bold" text-anchor="middle">7. HTTP 201 JSON Payload (sub-15ms)</text>
  </g>
</svg>