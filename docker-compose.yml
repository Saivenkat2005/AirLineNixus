x-logging: &default-logging
  driver: "loki"
  options:
    loki-url: "http://host.docker.internal:3100/loki/api/v1/push"
    loki-retries: 2
    loki-max-backoff: 800ms
    loki-timeout: 1s
    keep-file: "true"

services:
  mysql:
    image: mysql:8.0
    container_name: nexus_mysql
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: airlines
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
      interval: 5s
    networks:
      - data-network

  redis:
    image: redis:7-alpine
    container_name: nexus_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - data-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: nexus_zookeeper
    profiles: ["infrastructure"]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - data-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: nexus_kafka
    profiles: ["infrastructure"]
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - data-network

  prometheus:
    image: prom/prometheus:latest
    container_name: nexus_prometheus
    profiles: ["observability"]
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - internal-network

  grafana:
    image: grafana/grafana:latest
    container_name: nexus_grafana
    profiles: ["observability"]
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - internal-network

  loki:
    image: grafana/loki:latest
    container_name: nexus_loki
    profiles: ["observability"]
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - internal-network

  tempo:
    image: grafana/tempo:latest
    container_name: nexus_tempo
    profiles: ["observability"]
    command: [ "-config.file=/etc/tempo.yaml" ]
    ports:
      - "3200:3200"
      - "4317:4317"
    networks:
      - internal-network

  api-gateway:
    build:
      context: ./Backend-Nexus/api-gateway
      dockerfile: Dockerfile
    container_name: nexus_api_gateway
    ports:
      - "4000:4000"
    environment:
      - CORE_SERVICE_URL=http://core-service:8080
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      core-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - public-network
      - internal-network

  core-service:
    build:
      context: ./Backend/airlines
      dockerfile: Dockerfile
    container_name: nexus_core_service
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/airlines
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - PIXABAY_API_KEY=${PIXABAY_API_KEY}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
    networks:
      - data-network
      - internal-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: nexus_ai_service
    ports:
      - "8000:8000"
    environment:
      - JAVA_API_URL=http://core-service:8080
      - USE_DETERMINISTIC_AI=${USE_DETERMINISTIC_AI:-false}
      - AI_CLOUD_PROVIDER=${AI_CLOUD_PROVIDER:-}
      - AI_CLOUD_API_KEY=${AI_CLOUD_API_KEY:-}
      - AI_CLOUD_MODEL=${AI_CLOUD_MODEL:-gpt-4o-mini}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
    depends_on:
      core-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - internal-network
      - data-network

  ollama:
    image: ollama/ollama:latest
    container_name: nexus_ollama
    profiles: ["local-llm"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - internal-network

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: nexus_frontend
    ports:
      - "80:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - public-network

networks:
  public-network:
    driver: bridge
  internal-network:
    driver: bridge
  data-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  prometheus_data:
  grafana_data:
  ollama_data:
