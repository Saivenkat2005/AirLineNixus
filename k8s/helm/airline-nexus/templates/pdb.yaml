apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-core-service-pdb
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: core-service
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-frontend-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: frontend
