apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  type: {{ .Values.apiGateway.service.type | default "ClusterIP" }}
  ports:
  - port: {{ .Values.apiGateway.service.port | default 4000 }}
    targetPort: 4000
    name: http
  selector:
    app: api-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: core-service
  labels:
    app: core-service
spec:
  type: {{ .Values.coreService.service.type }}
  ports:
  - port: {{ .Values.coreService.service.port }}
    targetPort: 8080
    name: http
  selector:
    app: core-service
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  labels:
    app: ai-service
spec:
  type: {{ .Values.aiService.service.type }}
  ports:
  - port: {{ .Values.aiService.service.port }}
    targetPort: 8000
    name: http
  selector:
    app: ai-service
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
  - port: {{ .Values.frontend.service.port }}
    targetPort: 80
    name: http
  selector:
    app: frontend
